<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高機能カメラタイマー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="video-wrapper">
            <video id="preview" autoplay muted playsinline></video>
            <div id="stopwatch-display">00:00.00</div>
        </div>

        <div class="control-group">
            <p>【タイマー】</p>
            <button id="timerStartBtn">開始</button>
            <button id="timerStopBtn" disabled>停止</button>
            <button id="timerResetBtn">リセット</button>
        </div>

        <div class="control-group">
            <p>【録画・撮影】</p>
            <button id="recordStartBtn" class="record-btn">録画開始</button>
            <button id="recordStopBtn" class="record-btn" disabled>録画停止</button>
            <button id="photoBtn" class="photo-btn">写真を撮る</button>
        </div>

        <div class="control-group">
            <p>【設定】</p>
            <button id="switchCameraBtn">カメラ切り替え</button>
        </div>
        
        <div id="download-link-container"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
