<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hybrid Camera Timer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <div class="video-wrapper">
            <video id="preview" autoplay muted playsinline webkit-playsinline></video>
            
            <div id="stopwatch-display">00:00.00</div>

            <div class="top-toolbar">
                <button id="switchCameraBtn" class="icon-btn"><i data-lucide="refresh-cw"></i></button>
            </div>

            <div class="controls-overlay">
                <div class="timer-group">
                    <button id="timerStartBtn" class="icon-btn timer-start"><i data-lucide="play"></i></button>
                    <button id="timerStopBtn" class="icon-btn timer-stop" disabled><i data-lucide="pause"></i></button>
                    <button id="timerResetBtn" class="icon-btn"><i data-lucide="rotate-ccw"></i></button>
                </div>
                
                <div class="shutter-group">
                    <button id="photoBtn" class="shutter-btn photo"><i data-lucide="camera"></i></button>
                    <button id="recordStartBtn" class="shutter-btn record"><div class="record-dot"></div></button>
                    <button id="recordStopBtn" class="shutter-btn stop" disabled><i data-lucide="square"></i></button>
                </div>
            </div>
        </div>
        
        <div id="download-link-container"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
